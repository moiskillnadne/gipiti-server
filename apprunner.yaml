version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - npm ci
    build:
      - npm run build
      - npx prisma generate
    post-build:
      - echo "Build completed"
run:
  runtime-version: 20
  command: npm run start:prod
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: dev